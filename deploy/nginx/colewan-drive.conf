# Colewan Drive — Laravel + Inertia file drive.
#
# Install as /etc/nginx/sites-available/colewan-drive and symlink into
# sites-enabled. This is the plain :80 form; `certbot --nginx` rewrites it to
# add the TLS server block and the http->https redirect, which is how every
# other site on this box was set up.
#
# Two things differ from the other Laravel vhosts here, and both come from the
# same fact: this app moves 1 GB files.
#
#   1. client_max_body_size is 1100m. The others sit at 32m.
#   2. Downloads are handed to nginx via X-Accel-Redirect rather than streamed
#      by PHP. The shared php8.3 www pool allows five workers across five
#      Laravel apps; one 1 GB download held open by PHP would take a fifth of
#      that pool for the length of the transfer. This site also runs its own
#      pool so its uploads cannot starve the others.

server {
    listen 80;
    listen [::]:80;
    server_name drive.uitph.com;

    root /var/www/colewan-drive/public;
    index index.php;

    charset utf-8;

    access_log /var/log/nginx/colewan-drive.access.log;
    error_log  /var/log/nginx/colewan-drive.error.log;

    # The app validates uploads at 1 GB (max:1048576 KB); the multipart envelope
    # and header overhead need room on top. PHP-FPM's matching limits live in
    # /etc/php/8.3/fpm/pool.d/colewan-drive.conf — when the two disagree the
    # smaller wins and the browser just sees a dead connection or a 413.
    client_max_body_size 1100m;

    # A 1 GB upload over a slow link takes minutes. The defaults (60s) would cut
    # it off mid-body.
    client_body_timeout 600s;
    send_timeout 600s;

    # Internal only. FileController@download answers with
    #   X-Accel-Redirect: /internal-downloads/uploads/<uuid>.<ext>
    # and nginx serves the file from the private disk that PHP owns.
    #
    # The ^~ modifier is load-bearing, not style: with a plain prefix location
    # the `\.php$` regex block below would win the match, and an uploaded .php
    # file would be executed instead of downloaded. `internal` additionally
    # makes the location unreachable from the outside — the only way in is a
    # header the app itself emits.
    location ^~ /internal-downloads/ {
        internal;
        alias /var/www/colewan-drive/storage/app/private/;
    }

    # Vite fingerprints every filename under /build, so these can be cached
    # permanently — a rebuild changes the name, never the contents behind a name.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm-colewan-drive.sock;

        # Long enough for a large upload to be written into storage after nginx
        # has finished buffering it. Downloads no longer count against this.
        fastcgi_read_timeout 600s;
        fastcgi_send_timeout 600s;

        fastcgi_hide_header X-Powered-By;
    }

    # Never serve .env, .git, and friends — but leave ACME challenges reachable
    # so certbot renewals keep working.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
