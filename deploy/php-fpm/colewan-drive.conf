; Colewan Drive — dedicated PHP-FPM pool.
;
; Install as /etc/php/8.3/fpm/pool.d/colewan-drive.conf.
;
; This app needs upload limits roughly 500x the stock ones. Raising them in
; php.ini would apply them to every site on this box — goodboy, uniglobal,
; vault, xponent and project-tracker would all inherit a 512M memory ceiling
; and a 1 GB request cap they have no use for. A separate pool keeps the change
; contained, and gives this app its own worker budget so a burst of uploads
; cannot starve the shared www pool (which allows five workers in total).

[colewan-drive]

user = www-data
group = www-data

listen = /run/php/php8.3-fpm-colewan-drive.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; ondemand rather than dynamic: a personal drive is idle most of the day, and
; idle workers on a 2 vCPU / 8 GB box are better spent elsewhere. Workers spawn
; on the first request and retire after 60s of quiet.
pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 60s

; Recycle workers periodically so a leak in a long-lived process cannot grow
; unbounded. Well above normal traffic, so it costs nothing in practice.
pm.max_requests = 500

; Uploads still occupy a worker for the length of the transfer (downloads do
; not, they go out through X-Accel-Redirect). Give a 1 GB upload room to land.
request_terminate_timeout = 600s

php_admin_value[upload_max_filesize] = 1024M

; Must exceed upload_max_filesize: the POST body is the file plus the multipart
; envelope. If this is the smaller of the two, PHP discards the upload and
; hands the app an empty $_FILES with no error worth reading.
php_admin_value[post_max_size] = 1100M

; Uploads stream to a temp file rather than into memory, so this does not need
; to scale with file size. 512M is headroom for Inertia responses and artisan.
php_admin_value[memory_limit] = 512M

php_admin_value[max_execution_time] = 600

; Time spent receiving the request body is charged here, not to
; max_execution_time. The 60s default is what actually kills slow uploads.
php_admin_value[max_input_time] = 3600

; Keep half-finished 1 GB uploads out of /tmp, where they would compete with
; every other service on the box. Same filesystem as storage/, so PHP's final
; move is a rename rather than a copy of the whole file.
php_admin_value[upload_tmp_dir] = /var/www/colewan-drive/storage/app/tmp-uploads
php_admin_value[sys_temp_dir] = /var/www/colewan-drive/storage/app/tmp-uploads

php_admin_value[error_log] = /var/log/php8.3-fpm-colewan-drive.log
php_admin_flag[log_errors] = on

; The app renders its own error pages; leaking stack traces into an HTTP
; response would defeat APP_DEBUG=false.
php_admin_flag[display_errors] = off

php_admin_value[opcache.enable] = 1
php_admin_value[opcache.memory_consumption] = 128
php_admin_value[opcache.max_accelerated_files] = 20000

; Files only change on deploy, and deploy.sh reloads this pool. Skipping the
; stat() on every include is the single cheapest win available here.
php_admin_value[opcache.validate_timestamps] = 0
